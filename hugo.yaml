title: Benjamin Fernandez Media
locale: en-US
baseURL: https://benfernandezmedia.github.io/
timeZone: America/New_York
copyright: © 2026 Benjamin Fernandez Media, All rights reserved.

module:
  imports:
    - path: github.com/imfing/hextra

# Navigation Menu Links
menu:
  main:
    # Creator's Blog - Link 1
    - name: Creator's Blog
      pageRef: /blog
      params:
        type: link
        icon: newspaper
      weight: 1

    # Portfolio - Link 2
    - name: Portfolio
      url: https://cara.app/benfernandezmedia
      params:
        type: link
        icon: cards
      weight: 2

    # Socials - Nested Link
    - identifier: socials
      name: Socials
      params:
        type: link
        icon: users
      weight: 3

    # MediaPlay - Link 4
    - name: MediaPlay
      pageRef: /mediaplay
      params:
        type: link
        icon: mediaplay
      weight: 4

    # Search Bar
    - name: Search
      params:
        type: search
      weight: 5

    # RSS Feed
    - name: Subscribe to RSS Feed
      url: /index.xml
      params:
        type: icon
        icon: rssicon
      weight: 6

    # Help and Information - Link 6
    - name: Help and Information
      pageRef: /help
      params:
        type: icon
        icon: question-mark-circle
      weight: 7

    # Theme Toggle Switch
    - name: Theme Toggle
      params:
        type: theme-toggle
      weight: 8

    ## Social Links - Nested under Socials
    - name: Instagram
      url: https://instagram.com/benfernandezmedia
      params:
        type: link
        icon: instagram
      weight: 1
      parent: socials

    - name: GitHub
      url: https://github.com/benfernandezmedia
      params:
        type: link
        icon: github
      weight: 2
      parent: socials

    - name: YouTube
      url: https://youtube.com/@benfernandezmedia
      params:
        type: link
        icon: youtube
      weight: 3
      parent: socials

    - name: Patreon
      url: https://patreon.com/bfmextras
      params:
        type: link
        icon: patreon
      weight: 4
      parent: socials

    - name: TikTok
      url: https://tiktok.com/@benfernandezmedia
      params:
        type: link
        icon: tiktok
      weight: 5
      parent: socials

params:

  # OpenGraph Global Settings
  images:
    - og_preview.png

  # Banner Settings
  # Removed until next major update!

  # Global Theme Settings
  theme:
    # light | dark | system
    default: system
    displayToggle: false

  # Parse Git commit
  enableGitInfo: true

  # Display last modified date
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  # Display the author of last modification
  displayUpdatedAuthor: true

  # Markup Configuration
  markup:
    goldmark:
      renderer:
        unsafe: true
      highlight:
        noClasses: false

  # Image Zoom Settings
  imageZoom:
    enable: true

  # Blog Configuration
  blog:
    list:
      displayTags: true
  
  toc:
    displayTags: true

  # Inline Shortcodes Setting
  enableInlineShortcodes: true

  # Page Settings
  page:
    width: wide

  # Navigation Bar Settings
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: /images/navbar/bfmonlinelogo.svg
      dark: /images/navbar/bfmonlinelogo_dark.svg
      link: /
      width: 230
      height: 20
    width: wide

  # Footer Settings
  footer:
    displayPoweredBy: false
    displayCopyright: false
    width: wide
