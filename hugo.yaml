### Main Configuration Information
title: Benjamin Fernandez Media
locale: en
baseURL: https://benfernandezmedia.github.io/

### Hugo Module and Theme Configuration
module:
  imports:
    - path: github.com/imfing/hextra

### Navigation Menu Configuration
menu:
  main:
    # Creator's Blog - Links to the blog page of the site.
    - name: Creator's Blog
      pageRef: /blog
      params:
        type: link
        icon: rss
      weight: 1

    # Portfolio - Links to the Cara portfolio to showcase the creator's work.
    - name: Portfolio
      url: https://cara.app/benfernandezmedia
      params:
        type: link
        icon: cards
      weight: 2

    # Nested Menu - Socials
    - identifier: socials
      name: Socials
      params:
        type: link
        icon: users
      weight: 3

    # Social Links - Nested under the Socials menu item.
    - name: Instagram
      url: https://www.instagram.com/benfernandezmedia/
      parent: socials
      params:
        type: link
        icon: instagram

    - name: GitHub
      url: https://github.com/benfernandezmedia
      parent: socials
      params:
        type: link
        icon: github

    - name: Patreon
      url: https://www.patreon.com/bfmextras
      parent: socials
      params:
        type: link
        icon: patreon
    
    - name: YouTube
      url: https://www.youtube.com/@benfernandezmedia
      parent: socials
      params:
        type: link
        icon: youtube

    # Search Bar
    - name: Search
      params:
        type: search
      weight: 4

    # Help and Information - Links to the help page for users seeking assistance or more information about the site.
    - name: Help and Information
      pageRef: /help
      params:
        type: icon
        icon: question-mark-circle
      weight: 5

    # Theme Toggle - Allows users to switch between light and dark themes.
    - name: Theme Toggle
      params:
        type: theme-toggle
      weight: 6

### Hugo Parameters
params:

  # Open Graph - This is used for social media, showing the site preview when link is shared.
  images:
    - /images/social_preview.png

  # Markup Configuration - Setting the default markup to HTML, which is standard for web content.
  markup:
    goldmark:
      renderer:
        unsafe: true
      highlight:
        noClasses: false

  # Image Zoom Configuration - Enables zoom functionality for images in the content.
  imageZoom: 
    enable: true

  # Blog Configuration
  blog:
    list:
      displayTags: true

  toc:
    displayTags: true

  # Inline Shortcodes Configuration
  enableInlineShortcodes: true

  # Page Configuration
  page:
    width: wide

  # Navbar Configuration
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: /images/navbar/logo.svg
      dark: /images/navbar/logoDark.svg
      link: /
      width: 230
      height: 20
    width: wide

  # Theme Configuration
  theme:
     default: system
     displayToggle: false

  # Footer Configuration
  footer:
    displayPoweredBy: true
    displayCopyright: true
    width: wide
