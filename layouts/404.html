{{ define "main" }}
<style>
    @keyframes fadeInSlideDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
    #heroImage {
        animation: fadeInSlideDown 0.8s ease-out;
    }
    #message {
        animation: fadeIn 0.6s ease-out 1.0s both;
    }
    #reason {
        animation: fadeIn 0.6s ease-out 1.0s both;
    }
    #homeLink {
        animation: fadeIn 0.6s ease-out 1.5s both;
    }
</style>
<div class="container" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; ">
    <img id="heroImage" src="/images/404.png" alt="404 Not Found" style="max-width: 500px; margin-bottom: 30px;">
    <h1 id="message" style="font-size: 3rem; font-weight: 900; margin-bottom: 10px; text-align: center;">404: Page Not Found</h1>
    <p id="reason" class="subtitle is-4" style="margin-bottom: 30px; text-align: center;">The page you are looking for does not exist, or has been moved or deleted.</p>
    <a id="homeLink" href="/" style="font-size: 1.1rem; color: #ffffff; text-decoration: none; font-weight: 600;">Take me to the Benjamin Fernandez Media home page!</a>
</div>
{{ end }}
