{{ define "main" }}
<style>
    @keyframes fadeInSlideRight {
        from {
            opacity: 0;
            transform: translateX(-30px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }
    #image {
        animation: fadeInSlideRight 0.8s ease-out;
    }
    #reason {
        animation: fadeIn 0.6s ease-out 1.0s both;
    }
    #homeLink {
        animation: fadeIn 0.6s ease-out 1.5s both;
    }
</style>
<div class="container" style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; background-image: url('/images/404/aurorabliss.webp'); background-size: cover; background-position: center;">
    <img id="image" src="/images/404/404_message.webp" alt="404 Not Found" style="width: 630px; margin-bottom: 30px;">
    <p id="reason" class="subtitle is-4" style="margin-bottom: 30px; text-align: center; color: black;">The page you are looking for does not exist, or has been moved or deleted.</p>
    <a id="homeLink" href="/" style="font-size: 14px; font-weight: 600; color: black; padding: 24px; border-radius: 34px; background-color: rgb(255, 255, 255);">Benjamin Fernandez Media Home</a>
</div>
{{ end }}
